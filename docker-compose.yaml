services:
    db:
        image: postgres:16-alpine
        container_name: appointment-manager-db-dev
        ports: 5432:5432
        environment:
            - POSTGRES_USER: ${DB_USERNAME}
            - POSTGRES_PASSWORD: ${DB_PASSWORD}
            - POSTGRES_DB: ${DB_DATABASE}
        volumes:
            - postgres_storage:/var/lib/postgresql/data
    backend:
        build: ./backend
        container_name: appointment-manager-backend-dev
        ports: 8080:8080
        volumes:
            - type: bind
              source: ./backend
              target: /app
        depends_on:
            - db
        environment:
            - DB_HOST=db
    frontend:
        build: ./frontend
        container_name: appointment-manager-frontend-dev
        ports: 4200:4200
        volumes:
            - type: bind
              source: ./frontend
              target: /app
            - type: volume
              source: ./frontend/node_modules
        depends_on:
            - backend
        environment:
            - API_URL: ${API_URL}
